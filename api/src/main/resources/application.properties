spring.application.name=lagerscan
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lagerscan}
spring.datasource.username=${DB_USER:lagerscan}
spring.datasource.password=${DB_PASSWORD:lagerscan}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/api/actuator
lagerscan.zone=Europe/Berlin
lagerscan.public-url=${PUBLIC_URL:http://localhost:8080}
